<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Movie Recommendation System</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: url("https://wallpapercave.com/wp/wp2637488.jpg") no-repeat center center fixed;
      background-size: cover;
      color: #fff;
    }

    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      z-index: -1;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 25px;
      background: rgba(0, 0, 0, 0.8);
    }

    header h1 {
      font-size: 22px;
      margin: 0;
    }

    .menu-icon {
      cursor: pointer;
      width: 30px;
      height: 25px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .bar {
      height: 4px;
      width: 100%;
      background: white;
      border-radius: 5px;
    }

    .dropdown {
      display: none;
      position: absolute;
      top: 60px;
      right: 25px;
      background: rgba(0, 0, 0, 0.9);
      border-radius: 8px;
      overflow: hidden;
    }

    .dropdown a {
      display: block;
      padding: 12px 20px;
      color: white;
      text-decoration: none;
      transition: background 0.3s;
    }

    .dropdown a:hover {
      background: #e50914;
    }

    .show {
      display: block;
    }

    .container {
      max-width: 1000px;
      margin: auto;
      padding: 20px;
      text-align: center;
    }

    input, button {
      padding: 10px;
      margin: 10px 0;
      border: none;
      border-radius: 5px;
      font-size: 16px;
    }

    input {
      width: 60%;
    }

    button {
      background: #e50914;
      color: white;
      cursor: pointer;
    }

    .movie-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }

    .movie-card {
      background: rgba(20, 20, 20, 0.9);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0px 4px 15px rgba(0,0,0,0.7);
      transition: transform 0.3s ease;
    }

    .movie-card:hover {
      transform: scale(1.05);
    }

    .movie-card img {
      width: 100%;
      height: 250px;
      object-fit: cover;
    }

    .movie-info {
      padding: 10px;
      text-align: center;
    }

    .movie-info h3 {
      margin: 10px 0 5px;
      font-size: 18px;
    }

    .movie-info p {
      font-size: 14px;
      color: #bbb;
    }

    .ratings {
      margin-top: 8px;
      font-size: 14px;
    }

    .imdb {
      color: #f5c518; /* IMDb yellow */
      font-weight: bold;
    }

    .rotten {
      color: #fa320a; /* Rotten Tomatoes red */
      font-weight: bold;
    }
  </style>
</head>
<body>
  <header>
    <h1>🎬 Movie Recommendation</h1>
    <div class="menu-icon" onclick="toggleMenu()">
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
    </div>
    <div class="dropdown" id="dropdownMenu">
      <a href="#" onclick="searchCategory('Hollywood')">Hollywood</a>
      <a href="#" onclick="searchCategory('Bollywood')">Bollywood</a>
      <a href="#" onclick="searchCategory('Tollywood')">Tollywood</a>
    </div>
  </header>

  <div class="container">
    <h2>Find Your Next Movie</h2>
    <input type="text" id="movieInput" placeholder="Enter a movie name">
    <button onclick="recommendMovies()">Get Recommendations</button>

    <div class="movie-grid" id="movieGrid"></div>
  </div>

  <script>
    // 🔑 Replace with your OMDb API key
    const API_KEY = "30c146ab";

    function toggleMenu() {
      document.getElementById("dropdownMenu").classList.toggle("show");
    }

    window.onclick = function(event) {
      if (!event.target.closest('.menu-icon')) {
        let dropdown = document.getElementById("dropdownMenu");
        if (dropdown.classList.contains('show')) {
          dropdown.classList.remove('show');
        }
      }
    }

    async function recommendMovies() {
      const input = document.getElementById("movieInput").value.trim();
      const movieGrid = document.getElementById("movieGrid");
      movieGrid.innerHTML = "";

      if (!input) {
        movieGrid.innerHTML = "<p>Please enter a movie name.</p>";
        return;
      }

      try {
        const response = await fetch(`https://www.omdbapi.com/?s=${input}&apikey=${API_KEY}`);
        const data = await response.json();

        if (data.Response === "True") {
          for (let movie of data.Search) {
            const details = await fetch(`https://www.omdbapi.com/?i=${movie.imdbID}&apikey=${API_KEY}`);
            const detailsData = await details.json();

            let imdbRating = "N/A";
            let rottenRating = "N/A";

            if (detailsData.Ratings) {
              detailsData.Ratings.forEach(rating => {
                if (rating.Source === "Internet Movie Database") imdbRating = rating.Value;
                if (rating.Source === "Rotten Tomatoes") rottenRating = rating.Value;
              });
            }

            movieGrid.innerHTML += `
              <div class="movie-card">
                <img src="${movie.Poster !== "N/A" ? movie.Poster : "https://via.placeholder.com/200x300?text=No+Image"}" alt="${movie.Title}"onerror="this.src='https://via.placeholder.com/200x300?text=No+Image';">
                <div class="movie-info">
                  <h3>${movie.Title}</h3>
                  <p>Year: ${movie.Year}</p>
                  <div class="ratings">
                    <p class="imdb">⭐ IMDb: ${imdbRating}</p>
                    <p class="rotten">🍅 Rotten Tomatoes: ${rottenRating}</p>
                  </div>
                </div>
              </div>
            `;
          }
        } else {
          movieGrid.innerHTML = `<p>No movies found for "${input}".</p>`;
        }
      } catch (error) {
        console.error("Error fetching data:", error);
        movieGrid.innerHTML = "<p>Something went wrong. Try again later.</p>";
      }
    }

    function searchCategory(category) {
    document.getElementById("movieInput").value = category;
      recommendMovies();
             }

              document.getElementById("movieInput").addEventListener("keypress", function(event) {
               if (event.key === "Enter") {
               recommendMovies();
                 }
                });
  </script>
</body>
</html>
